name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download FFmpeg shared DLLs
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath .
          $ffmpegDir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path DashcamConverter/ffmpeg
          Copy-Item "$($ffmpegDir.Name)/bin/avcodec-*.dll" DashcamConverter/ffmpeg/
          Copy-Item "$($ffmpegDir.Name)/bin/avformat-*.dll" DashcamConverter/ffmpeg/
          Copy-Item "$($ffmpegDir.Name)/bin/avutil-*.dll" DashcamConverter/ffmpeg/
          Copy-Item "$($ffmpegDir.Name)/bin/swresample-*.dll" DashcamConverter/ffmpeg/
          Copy-Item "$($ffmpegDir.Name)/bin/swscale-*.dll" DashcamConverter/ffmpeg/

      - name: Generate test fixture
        shell: pwsh
        run: |
          $ffmpegDir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          $ffmpegExe = Join-Path $ffmpegDir.Name "bin/ffmpeg.exe"
          New-Item -ItemType Directory -Force -Path tests/fixtures
          & $ffmpegExe -y -f lavfi -i "testsrc=duration=3:size=320x240:rate=25" -c:v libx264 -pix_fmt yuv420p -f mpegts tests/fixtures/test.ts

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --verbosity normal

      - name: Publish
        run: >
          dotnet publish DashcamConverter/DashcamConverter.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dashcam Converter ${{ github.ref_name }}
          body: |
            ## Dashcam Converter ${{ github.ref_name }}

            Конвертер видео с видеорегистраторов в читаемый формат MP4.

            ### Особенности
            - Встроенный FFmpeg — не требует установки
            - P/Invoke (0 subprocess, 0 Process.Start)
            - GUI (drag-and-drop) + CLI (`remux`)
            - Поддержка нестандартных кодеков (x265 в AVI)

            ### Использование
            1. Скачать `DashcamConverter.exe`
            2. Запустить (Windows SmartScreen может ругаться — нажать «Подробнее → Выполнить»)
            3. Добавить файлы → Конвертировать

            ### CLI
            ```cmd
            DashcamConverter.exe remux input.avi
            DashcamConverter.exe remux input.avi -o output.mp4
            ```
          files: publish/DashcamConverter.exe
          generate_release_notes: true
