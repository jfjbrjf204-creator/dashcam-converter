name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $d = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          # For publish embed
          New-Item -ItemType Directory -Force -Path DashcamConverter/ffmpeg
          Copy-Item "$($d.Name)\bin\*.dll" DashcamConverter/ffmpeg/
          # For CI tests: save the bin path
          (Resolve-Path "$($d.Name)\bin").Path | Out-File -NoNewline ffmpeg_bin_path.txt
          Write-Host "FFmpeg bin: $(Get-Content ffmpeg_bin_path.txt)"

      - name: Create test fixture
        shell: pwsh
        run: |
          $d = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path tests/fixtures
          & "$($d.Name)\bin\ffmpeg.exe" -y -f lavfi -i "testsrc=duration=3:size=320x240:rate=25" -c:v libx264 -pix_fmt yuv420p -f mpegts tests/fixtures/test.ts
          Write-Host "Fixture: $((Get-Item tests/fixtures/test.ts).Length) bytes"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        shell: pwsh
        run: |
          $bin = Get-Content ffmpeg_bin_path.txt
          $env:DASHCAM_FFMPEG_PATH = $bin
          # Also add to PATH for NativeLibrary fallback
          $env:PATH = "$bin;$env:PATH"
          Write-Host "Testing with FFmpeg at: $bin"
          dotnet test --no-build -c Release --verbosity normal

      - name: Publish Windows package
        shell: pwsh
        run: |
          dotnet publish DashcamConverter/DashcamConverter.csproj -c Release -r win-x64 --self-contained true -o publish
          Compress-Archive -Path publish\* -DestinationPath DashcamConverter-win-x64.zip -Force
          Write-Host "Package: $((Get-Item DashcamConverter-win-x64.zip).Length) bytes"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DashcamConverter-win-x64
          path: DashcamConverter-win-x64.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.3"
          $title = "Dashcam Converter v1.0.3"
          $notes = @"
          Windows x64 self-contained build.

          ## Изменения

          - Автоматическая перекодировка несовместимого аудио (ADPCM → MP3) при remux в MP4.
          - Расширены сообщения об ошибках с кодами FFmpeg и CORE для диагностики.

          Download `DashcamConverter-win-x64.zip`, unpack it, and run `DashcamConverter.exe`.
          "@

          if (gh release view $tag 2>$null) {
            gh release upload $tag DashcamConverter-win-x64.zip --clobber
          } else {
            gh release create $tag DashcamConverter-win-x64.zip --title $title --notes $notes --target $env:GITHUB_SHA
          }
