name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download FFmpeg shared DLLs
        shell: pwsh
        run: |
          # Use pinned FFmpeg 7.0 build (compatible with FFmpeg.AutoGen 7.0.0)
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2024-07-12-15-22/ffmpeg-N-116190-gf2e4c1fbac-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          New-Item -ItemType Directory -Force -Path DashcamConverter/ffmpeg
          Copy-Item ffmpeg_extracted/*/bin/avcodec-*.dll DashcamConverter/ffmpeg/
          Copy-Item ffmpeg_extracted/*/bin/avformat-*.dll DashcamConverter/ffmpeg/
          Copy-Item ffmpeg_extracted/*/bin/avutil-*.dll DashcamConverter/ffmpeg/
          Copy-Item ffmpeg_extracted/*/bin/swresample-*.dll DashcamConverter/ffmpeg/
          Copy-Item ffmpeg_extracted/*/bin/swscale-*.dll DashcamConverter/ffmpeg/
          # Set env for test runtime
          $binPath = "$(Get-Location)\ffmpeg_extracted\*\bin" | Resolve-Path
          "DASHCAM_FFMPEG_PATH=$binPath" >> $env:GITHUB_ENV

      - name: Generate test fixture
        shell: pwsh
        run: |
          $ffmpegExe = Get-ChildItem ffmpeg_extracted/*/bin/ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path tests/fixtures
          & $ffmpegExe -y -f lavfi -i "testsrc=duration=3:size=320x240:rate=25" -c:v libx264 -pix_fmt yuv420p -f mpegts tests/fixtures/test.ts
          Write-Host "Fixture size: $((Get-Item tests/fixtures/test.ts).Length) bytes"
          Write-Host "DASHCAM_FFMPEG_PATH = $env:DASHCAM_FFMPEG_PATH"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
