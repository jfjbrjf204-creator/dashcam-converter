name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ffmpeg (choco)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # Verify
          ffmpeg -version
          # Copy DLLs for publish embed
          $ffmpegBin = (Get-Command ffmpeg).Source | Split-Path
          New-Item -ItemType Directory -Force -Path DashcamConverter/ffmpeg
          Copy-Item "$ffmpegBin\avcodec-*.dll" DashcamConverter/ffmpeg/ -ErrorAction SilentlyContinue
          Copy-Item "$ffmpegBin\avformat-*.dll" DashcamConverter/ffmpeg/ -ErrorAction SilentlyContinue
          Copy-Item "$ffmpegBin\avutil-*.dll" DashcamConverter/ffmpeg/ -ErrorAction SilentlyContinue
          Copy-Item "$ffmpegBin\swresample-*.dll" DashcamConverter/ffmpeg/ -ErrorAction SilentlyContinue
          Copy-Item "$ffmpegBin\swscale-*.dll" DashcamConverter/ffmpeg/ -ErrorAction SilentlyContinue

      - name: Create test fixture
        run: |
          New-Item -ItemType Directory -Force -Path tests\fixtures
          ffmpeg -y -f lavfi -i "testsrc=duration=3:size=320x240:rate=25" -c:v libx264 -pix_fmt yuv420p -f mpegts tests\fixtures\test.ts

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
